name: Build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86-64
            platform: linux
            runner: ubuntu-latest
          - label: Windows x86-64
            platform: windows
            runner: windows-latest
          - label: macOS Apple silicon
            platform: macos
            runner: macos-15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux multimedia libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxkbcommon-x11-0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest

  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Match tag to project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(
            python -c \
              'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])'
          )"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${version}." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')))
    needs:
      - validate-tag
      - test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86-64
            platform: linux
            runner: ubuntu-latest
            artifact: vulture-linux-x86_64
            archive: Vulture-Linux-x86_64.tar.gz
          - label: Windows x86-64
            platform: windows
            runner: windows-latest
            artifact: vulture-windows-x86_64
            archive: Vulture-Windows-x86_64.zip
          - label: macOS Apple silicon
            platform: macos
            runner: macos-15
            artifact: vulture-macos-arm64
            archive: Vulture-macOS-arm64.zip
          - label: macOS Intel
            platform: macos
            runner: macos-15-intel
            artifact: vulture-macos-x86_64
            archive: Vulture-macOS-x86_64.zip
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux multimedia libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxkbcommon-x11-0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bundle]"
      - name: Run test suite
        run: python -m pytest
      - name: Build desktop bundle
        run: python -m PyInstaller --noconfirm --clean packaging/vulture.spec
      - name: Check Linux bundle
        if: matrix.platform == 'linux'
        run: dist/Vulture/Vulture --check-runtime
      - name: Check Windows bundle
        if: matrix.platform == 'windows'
        run: dist\Vulture\Vulture.exe --check-runtime
      - name: Check macOS bundle
        if: matrix.platform == 'macos'
        run: dist/Vulture.app/Contents/MacOS/Vulture --check-runtime
      - name: Archive Linux bundle
        if: matrix.platform == 'linux'
        run: tar -C dist -czf "${{ matrix.archive }}" Vulture
      - name: Archive Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Vulture -DestinationPath "${{ matrix.archive }}"
      - name: Archive macOS bundle
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Vulture.app "${{ matrix.archive }}"
      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate-tag
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum Vulture-* > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --generate-notes \
              --title "Vulture ${GITHUB_REF_NAME#v}" \
              --verify-tag
          fi

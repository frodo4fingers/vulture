name = "vulture-posture"
version = "0.6.0"
source = { editable = "." }
dependencies = [
    { name = "mediapipe" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.12'" },
    { name = "numpy", version = "2.5.4", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "opencv-contrib-python" },
    { name = "platformdirs" },
    { name = "pydantic" },
    { name = "pyside6" },
]

[package.optional-dependencies]
bundle = [
    { name = "pyinstaller" },
]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "mediapipe", specifier = ">=0.10.21,<1.1" },
    { name = "numpy", specifier = ">=1.26,<3" },
    { name = "opencv-contrib-python", specifier = ">=4.10,<6" },
    { name = "platformdirs", specifier = ">=4.3,<5" },
    { name = "pydantic", specifier = ">=2.10,<3" },
    { name = "pyinstaller", marker = "extra == 'bundle'", specifier = ">=6.11,<7" },
    { name = "pyside6", specifier = ">=6.8,<7" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.3,<10" },
]
provides-extras = ["dev", "bundle"]
